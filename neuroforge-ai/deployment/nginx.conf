# Optional single-origin reverse proxy (docker compose --profile proxy up).
# With this in front, build the frontend with NEXT_PUBLIC_API_URL=https://your-host (same origin) and set CORS_ORIGINS accordingly.
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 60m;      # must exceed MAX_UPLOAD_MB
  proxy_read_timeout   300s;     # long answers / comparisons

  upstream backend  { server backend:8000; }
  upstream frontend { server frontend:3000; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
