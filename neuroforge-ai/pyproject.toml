[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge-ai"
version = "1.0.0"
description = "Multimodal document intelligence and decision automation platform"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "rapidocr-onnxruntime>=1.3",
  "spacy>=3.7",
  "celery>=5.3",
  "redis>=5",
  "psycopg2-binary>=2.9",
  "boto3>=1.34",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.7"]
tesseract = ["pytesseract>=0.3"]
verify = ["pgserver>=0.1"]   # embedded PostgreSQL for scripts/verify_postgres.py (no Docker needed)
dev = ["pytest>=8", "pytest-cov>=5", "pywin32>=306; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
markers = [
  "slow: tests that run OCR or the full ingestion pipeline",
]
